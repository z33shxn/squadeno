[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squadeno"
version = "1.0.0"
description = "Telling lung adenocarcinoma from lung squamous cell carcinoma with TCGA RNA seq, with a leakage audit, confounder tests and external validation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammed Zeeshan" }]
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.8",
  "matplotlib>=3.8", "joblib>=1.3", "reportlab>=4.0", "pypdf>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
squadeno = "squadeno.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
